        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        activeReservations: { type: integer }
        settledToday: { type: integer }
        refundedToday: { type: integer }
        dailyBudgetUsed: { type: integer }
        dailyCreditLimit: { type: integer }
        spendingEnabled: { type: boolean }
        utcDay: { type: string }
