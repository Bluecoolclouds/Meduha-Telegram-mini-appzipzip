        duration: { type: integer, minimum: 4, maximum: 30 }
        expiresAt: { type: integer }
    GenjutsuInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, modelId, scenario, videoId, imageIds, prompt, resolution]
