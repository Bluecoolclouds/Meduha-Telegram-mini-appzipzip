            schema: { $ref: "#/components/schemas/AdminCreditTransitionInput" }
      responses:
        "200":
          description: Finance service release result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMutationResult" }
  /meduha/admin/credits/{reservationId}/refund:
    parameters:
      - { in: path, name: reservationId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: refundAdminCredits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreditTransitionInput" }
      responses:
        "200":
          description: Finance service refund result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMutationResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  # Template errors use the existing JSON error envelope and standard 400/401/403/404/429/503 statuses.
  securitySchemes:
    TelegramWebhookSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  schemas:
    VideoFileField:
      type: object
      required: [path, kind, array]
      properties:
        path: { type: string }
        kind: { type: string, enum: [image, video, audio, document] }
        array: { type: boolean }
    VideoFamily:
      type: object
      required: [id, name, description, source, modes]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        source: { type: string }
        modes: { type: array, items: { type: string } }
    VideoCatalogModel:
      type: object
      required: [id, familyId, name, mode, endpoint, source, workflow, schema, outputSchema, fileFields, available, modelId, creditPrice]
      properties:
        id: { type: string }
        familyId: { type: string }
        name: { type: string }
        mode: { type: string }
        endpoint: { type: string }
        source: { type: string }
        workflow: { type: boolean }
        schema: { type: object, additionalProperties: true }
        outputSchema: { type: object, additionalProperties: true }
        fileFields: { type: array, items: { $ref: "#/components/schemas/VideoFileField" } }
        available: { type: boolean }
        quoteScenario: { type: [string, "null"], enum: [genjutsu, object-swap, restyle, null] }
        modelId: { type: [string, "null"] }
        creditPrice: { type: [integer, "null"] }
    VideoCatalog:
      type: object
      required: [families, models, spendingEnabled, providerConfigured, storageConfigured]
      properties:
        families: { type: array, items: { $ref: "#/components/schemas/VideoFamily" } }
        models: { type: array, items: { $ref: "#/components/schemas/VideoCatalogModel" } }
        spendingEnabled: { type: boolean }
        providerConfigured: { type: boolean }
        storageConfigured: { type: boolean }
    VideoGenerationInput:
      type: object
      required: [idempotencyKey, modelId, catalogId, expectedCreditPrice, parameters, references]
      properties:
        idempotencyKey: { type: string, format: uuid }
        modelId: { type: string, format: uuid }
        catalogId: { type: string, maxLength: 200 }
        expectedCreditPrice: { type: integer, minimum: 1, maximum: 100000000 }
        parameters: { type: object, additionalProperties: true }
        references:
          type: object
          maxProperties: 100
          additionalProperties:
            type: array
            maxItems: 30
            items: { type: string, format: uuid }
    TemplateLikeInput:
      type: object
      required: [liked]
      properties:
        liked: { type: boolean }
    TemplateLikeState:
      type: object
      required: [likeCount, likedByMe]
      properties:
        likeCount: { type: integer, minimum: 0 }
        likedByMe: { type: boolean }
    TemplateSaveInput:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }
    TemplateSaveState:
      type: object
      required: [savedByMe]
      properties:
        savedByMe: { type: boolean }
    TemplatePublicationInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [submit, publish, withdraw] }
    TemplateUploadInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm, video/quicktime, audio/mpeg, audio/wav, audio/x-wav, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.openxmlformats-officedocument.presentationml.presentation, text/markdown, text/plain] }
        size: { type: integer, minimum: 1, maximum: 104857600 }
    TemplateRecipe:
      type: object
      required: [version, kind, catalogId, parameters, references]
      properties:
        version: { type: integer, enum: [1] }
        kind: { type: string, enum: [photo, video] }
        catalogId: { type: string, minLength: 1, maxLength: 240 }
        parameters: { type: object, additionalProperties: true }
        references:
          type: object
          maxProperties: 100
          additionalProperties:
            type: array
            maxItems: 30
            items: { type: string, format: uuid }
    TemplateRecipeFile:
      type: object
      required: [id, url, contentType, size]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 1 }
    TemplateRecipeView:
      type: object
      required: [id, title, sourceTemplateId, recipe, files]
      properties:
        id: { type: string }
        title: { type: string }
        sourceTemplateId: { type: [string, "null"] }
        recipe: { $ref: "#/components/schemas/TemplateRecipe" }
        files:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/TemplateRecipeFile" }
    TemplateRepeatInput:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
    TemplateRecipeDraftInput:
      type: object
      required: [title, recipe]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        recipe: { $ref: "#/components/schemas/TemplateRecipe" }
    TemplateInput:
      type: object
      required: [title, description, kind, poster, width, height, prompt, tags, parameters]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        kind: { type: string, enum: [photo, video, audio] }
        recipe:
          oneOf:
            - { $ref: "#/components/schemas/TemplateRecipe" }
            - { type: "null" }
        poster: { type: string, pattern: '^(\/api\/meduha\/media\/[a-f0-9-]{36}|images\/[a-z0-9/_-]+\.(png|jpe?g|webp)|https:\/\/[^ ]+)$' }
        videoUrl: { type: [string, "null"], pattern: '^(\/api\/meduha\/media\/[a-f0-9-]{36}|https:\/\/[^ ]+)$' }
        audioUrl: { type: [string, "null"], pattern: '^(\/api\/meduha\/media\/[a-f0-9-]{36}|https:\/\/[^ ]+)$' }
        width: { type: integer, minimum: 1, maximum: 8192 }
        height: { type: integer, minimum: 1, maximum: 8192 }
        prompt: { type: string, minLength: 1, maxLength: 10000 }
        tags:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 50 }
        sourceUrl: { type: [string, "null"], pattern: '^https://' }
        credit: { type: [string, "null"] }
        parameters:
          type: object
          required: [model, style, ratio, duration]
          properties:
            model: { type: string, maxLength: 100 }
            style: { type: string, maxLength: 100 }
            ratio: { type: string, maxLength: 30 }
            duration: { type: string, maxLength: 30 }
    StudioTemplate:
      allOf:
        - { $ref: "#/components/schemas/TemplateInput" }
        - type: object
          required: [id, status]
          properties:
            id: { type: string }
            ownerId: { type: string }
            status: { type: string, enum: [draft, pending, published] }
            authorName: { type: string, maxLength: 80 }
            likeCount: { type: integer, minimum: 0 }
            likedByMe: { type: boolean }
            savedByMe: { type: boolean }
            authorAvatarUrl: { type: [string, "null"], maxLength: 2048, pattern: '^https://' }
    TemplatePage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StudioTemplate" }
        nextCursor: { type: [integer, "null"] }
        total: { type: integer }
    TelegramBotUpdate:
      type: object
      additionalProperties: true
      required: [update_id]
      properties:
        update_id: { type: integer, minimum: 0, maximum: 9007199254740991 }
        message:
          type: object
          additionalProperties: true
          properties:
            text: { type: string }
            chat:
              type: object
              additionalProperties: true
              required: [id, type]
              properties:
                id: { type: integer }
                type: { type: string }
    TelegramCredentials:
      type: object
      required: [initData]
      properties:
        initData: { type: string, minLength: 1, maxLength: 16384 }
    MeduhaPreferences:
      type: object
      required: [notifications, quality]
      properties:
        notifications: { type: boolean }
        quality: { type: boolean }
    MeduhaAccount:
      type: object
      required: [id, firstName, lastName, username, photoUrl, languageCode, credits, subscription]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: [string, "null"] }
        username: { type: [string, "null"] }
        photoUrl: { type: [string, "null"] }
        languageCode: { type: string }
        credits: { type: integer, minimum: 0 }
        subscription: { type: string, enum: [none, plus] }
    MeduhaSession:
      type: object
      required: [account, telegramConfigured]
      properties:
        telegramBotUsername:
          type: [string, "null"]
          description: Public bot username verified by the server, for opening the bot outside Telegram.
        account:
          oneOf:
            - $ref: "#/components/schemas/MeduhaAccount"
            - { type: "null" }
        telegramConfigured: { type: boolean }
    MeduhaDraftInput:
      type: object
      required: [title, type, prompt, style, model, ratio, duration]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [photo, video, music] }
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        style: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        ratio: { type: string, maxLength: 30 }
        duration: { type: string, maxLength: 30 }
        referenceName: { type: string, maxLength: 255 }
    MeduhaDraft:
      allOf:
        - $ref: "#/components/schemas/MeduhaDraftInput"
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            updatedAt: { type: number }
    MeduhaDraftImport:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MeduhaDraft"
    MeduhaWork:
      type: object
      required: [id, title, type, status, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string, enum: [photo, video, music] }
        status: { type: string, enum: [queued, processing, completed, failed] }
        createdAt: { type: number }
    MeduhaBootstrap:
      type: object
      required: [account, drafts, works, settings]
      properties:
        account: { $ref: "#/components/schemas/MeduhaAccount" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/MeduhaDraft" }
        works:
          type: array
          items: { $ref: "#/components/schemas/MeduhaWork" }
        settings: { $ref: "#/components/schemas/MeduhaPreferences" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MeduhaReportInput:
      type: object
      required: [templateId, reason]
      properties:
        templateId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    MeduhaReportReceipt:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    MeduhaWallet:
      type: object
      required: [credits, subscription]
      properties:
        credits: { type: integer, minimum: 0 }
        subscription: { type: string }
    AdminStatus:
      type: object
      required: [authenticated, isAdmin, setupRequired, passwordLoginAvailable, pairingLoginAvailable]
      properties:
        authenticated: { type: boolean }
        isAdmin: { type: boolean }
        setupRequired: { type: boolean, description: No designated administrator account is currently available }
        adminId: { type: string, description: Authenticated actor ID; temporary admin uses a non-Telegram namespace }
        authMethod: { type: string, enum: [telegram, temporary], description: Present only when authenticated }
        passwordLoginAvailable: { type: boolean }
        pairingLoginAvailable: { type: boolean }
    AdminSession:
      type: object
      required: [authenticated, isAdmin, setupRequired, expiresAt]
      properties:
        authenticated: { type: boolean }
        isAdmin: { type: boolean }
        setupRequired: { type: boolean }
        expiresAt: { type: string, format: date-time }
    AdminSessionInfo:
      type: object
      additionalProperties: false
      required: [id, authMethod, createdAt, expiresAt, current]
      properties:
        id: { type: string, format: uuid }
        authMethod: { type: string, enum: [telegram, temporary] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
    AdminSessionsRevoked:
      type: object
      additionalProperties: false
      required: [revokedCount]
      properties:
        revokedCount: { type: integer, minimum: 0 }
    AdminPairingLoginInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$' }
    AdminPasswordCredentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    AdminPairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, minLength: 64, maxLength: 64 }
        expiresAt: { type: string, format: date-time }
    AdminChannelInput:
      type: object
      additionalProperties: false
      required: [name, baseUrl, adapter, priority, concurrencyLimit, dailyCreditLimit]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        baseUrl: { type: string, format: uri, pattern: '^https://' }
        adapter: { type: string, minLength: 1, maxLength: 80 }
        secretRef:
          type: [string, "null"]
          maxLength: 137
          pattern: '^secret://[A-Za-z][A-Za-z0-9_.-]{0,127}$'
        enabled: { type: boolean, default: false }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        concurrencyLimit: { type: integer, minimum: 1, maximum: 10000 }
        dailyCreditLimit: { type: integer, minimum: 0 }
    AdminChannelUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        baseUrl: { type: string, format: uri, pattern: '^https://' }
