          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMutationResult" }
  /meduha/admin/credits/reserve:
    post:
      operationId: reserveAdminCredits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreditReservationInput" }
      responses:
        "200":
          description: Finance service reservation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMutationResult" }
  /meduha/admin/credits/{reservationId}/settle:
    parameters:
      - { in: path, name: reservationId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: settleAdminCredits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreditTransitionInput" }
      responses:
        "200":
          description: Finance service settlement result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceMutationResult" }
  /meduha/admin/credits/{reservationId}/release:
    parameters:
