        channelId: { type: string, format: uuid }
        upstreamId: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [photo, video, audio] }
        enabled: { type: boolean }
        creditPrice: { type: integer, minimum: 0 }
        genjutsuPricing:
          type: array
          items: { $ref: "#/components/schemas/GenjutsuTariff" }
        estimatedCost: { type: [integer, "null"], minimum: 0 }
        limits: { type: object, additionalProperties: { type: number, minimum: 0 } }
