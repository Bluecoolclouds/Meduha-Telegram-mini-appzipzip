openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /meduha/video/catalog:
    get:
      operationId: getVideoCatalog
      responses:
        "200":
          description: Verified video families and exact mode schemas with configured availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoCatalog" }
  /meduha/video/generations:
    post:
      operationId: createVideoGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoGenerationInput" }
      responses:
        "202":
          description: Queued or existing private video generation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationSubmission" }
        "400": { description: Invalid mode parameters or references }
        "401": { description: Telegram account required }
        "409": { description: "Unavailable model, price, balance or spending" }
  /meduha/photo/catalog:
    get:
      operationId: getPhotoCatalog
      responses:
        "200":
          description: Verified photo models, input schemas and configured availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoCatalog" }
  /meduha/photo/quote:
    post:
      operationId: quotePhotoGeneration
      tags: [meduha]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoQuoteInput" }
      responses:
        "200":
          description: Non-billable request estimate, never queues generation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoQuote" }
        "400": { description: Invalid input }
        "401": { description: Telegram account required }
        "409": { description: No safe price or model unavailable }
        "503": { description: Estimate unavailable }
  /meduha/photo/generations:
    post:
      operationId: createPhotoGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoGenerationInput" }
      responses:
        "202":
          description: Queued or existing private photo generation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationSubmission" }
        "400": { description: Invalid model inputs }
        "401": { description: Telegram account required }
        "409": { description: "Model, price, balance or spending unavailable" }
  /meduha/template-recipes/{id}:
    get:
      operationId: getTemplateRecipe
      tags: [meduha]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Explicitly shared recipe or an owner's private recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateRecipeView" }
  /meduha/templates/{id}/repeat:
    post:
      operationId: repeatTemplate
      tags: [meduha]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRepeatInput" }
      responses:
        "201":
          description: Independent private copy; no generation or credit mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateRecipeView" }
  /meduha/template-repeats/{id}:
    get:
      operationId: getTemplateRepeat
      tags: [meduha]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authenticated owner's saved recipe snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateRecipeView" }
  /meduha/template-recipe-drafts:
    post:
      operationId: createTemplateRecipeDraft
      tags: [meduha]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRecipeDraftInput" }
      responses:
        "201":
          description: Saved private recipe for preparing a publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateRecipeView" }
  /meduha/templates:
    get:
      operationId: listTemplates
      parameters:
        - { in: query, name: query, schema: { type: string, maxLength: 100 } }
        - { in: query, name: tag, schema: { type: string, minLength: 1, maxLength: 100 }, description: "Exact publication tag, case-insensitive; an optional leading hash is ignored." }
        - { in: query, name: kind, schema: { type: string, enum: [all, photo, video, audio], default: all } }
        - { in: query, name: scope, schema: { type: string, enum: [public, mine, moderation, liked, saved], default: public } }
        - { in: query, name: cursor, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
      responses:
        "200":
          description: Stable descending keyset page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePage" }
    post:
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioTemplate" }
  /meduha/catalog/prices:
    get:
      operationId: getModelCatalogPrices
      tags: [meduha]
      summary: Public configured credit prices for enabled Higgsfield video models
      responses:
        "200":
          description: Public model prices only, without channel settings or credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCatalogPriceList" }
  /meduha/genjutsu/models:
    get:
      operationId: listGenjutsuModels
      responses:
        "200":
          description: Enabled and priced Genjutsu models with the spending switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationModelList" }
        "401": { description: Telegram account required }
  /meduha/genjutsu/styles:
    get:
      operationId: listGenjutsuStyles
      parameters:
        - { in: query, name: modelId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Currently available provider style presets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenjutsuStyleList" }
        "401": { description: Telegram account required }
        "503": { description: Styles temporarily unavailable }
  /meduha/genjutsu/quote:
    post:
      operationId: createGenjutsuPriceQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenjutsuPriceQuoteInput" }
      responses:
        "200":
          description: Short-lived server-signed quote based on verified video metadata and current tariff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenjutsuPriceQuote" }
        "400": { description: Invalid media or parameters }
        "401": { description: Telegram account required }
        "409": { description: Model or tariff unavailable }
        "503": { description: Quote service temporarily unavailable }
  /meduha/genjutsu/generations:
    post:
      operationId: createGenjutsuGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenjutsuInput" }
      responses:
        "202":
          description: Persisted job with a reserved credit price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationSubmission" }
        "400": { description: Invalid input media or parameters }
        "401": { description: Telegram account required }
        "409": { description: "Model, funds, or spending unavailable" }
  /meduha/generations/models:
    get:
      operationId: listGenerationModels
      responses:
        "200":
          description: Enabled Seedance models and spending switch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationModelList" }
        "401": { description: Telegram account required }
  /meduha/generations:
    get:
      operationId: listMeduhaGenerations
      responses:
        "200":
          description: Recent generation jobs owned by the signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationJobList" }
        "401": { description: Telegram account required }
    post:
      operationId: createMeduhaGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerationInput" }
      responses:
        "202":
          description: Persisted job accepted for one-time provider submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationSubmission" }
        "400": { description: Invalid generation parameters }
        "401": { description: Telegram account required }
        "409": { description: "Model unavailable, spending disabled, or insufficient budget" }
  /meduha/generations/{id}/video:
    get:
      operationId: getMeduhaGenerationVideo
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private video streamed to its owner, with byte-range support
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
        "401": { description: Telegram account required }
        "404": { description: Video not found or owned by another account }
        "503": { description: Video is temporarily unavailable }
  /meduha/templates/access:
    get:
      operationId: getTemplateAccess
      responses:
        "200":
          description: Server verified role
          content:
            application/json:
              schema:
                type: object
                required: [isAdmin]
                properties:
                  isAdmin: { type: boolean }
  /meduha/templates/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTemplate
      responses:
        "200":
          description: Publicly published work only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioTemplate" }
        "404":
          description: Work is missing or is not publicly published
    put:
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Saved draft, edits require republication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioTemplate" }
  /meduha/templates/{id}/publication:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: setTemplatePublication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePublicationInput"
      responses:
        "200":
          description: Updated publication status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudioTemplate" }
  /meduha/templates/{id}/like:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setTemplateLike
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateLikeInput" }
      responses:
        "200":
          description: Persisted account like and current public count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateLikeState" }
        "401": { description: Telegram account required }
        "404": { description: Publication not available }
  /meduha/templates/{id}/save:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setTemplateSave
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateSaveInput" }
      responses:
        "200":
          description: Persisted account save state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateSaveState" }
        "401": { description: Telegram account required }
        "404": { description: Publication not available }
  /meduha/uploads:
    post:
      operationId: requestTemplateUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateUploadInput"
      responses:
        "200":
          description: Direct upload URL, valid 15 minutes
          content:
            application/json:
              schema:
                type: object
                required: [id, uploadUrl]
                properties:
                  id: { type: string, format: uuid }
                  uploadUrl: { type: string }
  /meduha/uploads/{id}/complete:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeTemplateUpload
      responses:
        "200":
          description: Verified immutable file
          content:
            application/json:
              schema:
                type: object
                required: [objectPath]
                properties:
                  objectPath: { type: string }
  /meduha/feed-media/{id}/{variant}:
    get:
      operationId: getFeedMedia
      tags: [templates]
      summary: Small cached media for published community cards; originals remain unchanged
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: variant, in: path, required: true, schema: { type: string, enum: [thumb, preview] } }
        - { name: Range, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        "200":
          description: WebP thumbnail or silent six-second MP4 preview
          content:
            image/webp: { schema: { type: string, format: binary } }
            video/mp4: { schema: { type: string, format: binary } }
        "206":
          description: Partial preview content
          content:
            video/mp4: { schema: { type: string, format: binary } }
        "304": { description: Unchanged preview; publication access is still checked }
        "404": { description: Work is not published or has no such media }
        "416": { description: Invalid byte range }
        "503": { description: Preview is being prepared or media processing is unavailable }
  /meduha/media/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getTemplateMedia
      description: Public only while referenced by a published template; otherwise author/admin only. Supports byte ranges. The app may request an attachment by appending download=true and an optional filename.
      responses:
        "200":
          description: Media bytes; includes an attachment filename when download=true
          headers:
            Content-Disposition:
              schema: { type: string }
        "206": { description: Partial media bytes }
        "404": { description: Not found or private }
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      description: Telegram-only callback. Authenticated with X-Telegram-Bot-Api-Secret-Token; never called by the frontend.
      security:
        - TelegramWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramBotUpdate"
      responses:
        "200":
          description: Update processed
        "400":
          description: Malformed update
        "403":
          description: Invalid Telegram webhook secret
        "503":
          description: Temporary failure; Telegram should retry
  /meduha/session:
    get:
      operationId: getMeduhaSession
      responses:
        "200":
          description: Session and server configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeduhaSession"
    delete:
      operationId: logoutMeduha
      responses:
        "204":
          description: Session revoked
  /meduha/auth/telegram:
    post:
      operationId: authenticateMeduhaTelegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramCredentials"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeduhaSession"
  /meduha/bootstrap:
    get:
      operationId: getMeduhaBootstrap
      responses:
        "200":
          description: Private account data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeduhaBootstrap"
  /meduha/drafts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    put:
      operationId: saveMeduhaDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeduhaDraftInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeduhaDraft"
    delete:
      operationId: deleteMeduhaDraft
      responses:
        "204":
          description: Draft deleted
  /meduha/drafts/import:
    post:
      operationId: importMeduhaDrafts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeduhaDraftImport"
      responses:
        "200":
          description: All account drafts after non-destructive import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeduhaDraft"
  /meduha/settings:
    patch:
      operationId: saveMeduhaSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeduhaPreferences"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeduhaPreferences"
  /meduha/reports:
    post:
      operationId: submitMeduhaReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeduhaReportInput" }
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeduhaReportReceipt" }
        "200":
          description: Duplicate report deduplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeduhaReportReceipt" }
        "401": { description: Authenticated account required }
        "404": { description: Published template not found }
  /meduha/wallet:
    get:
      operationId: getMeduhaWallet
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
      responses:
        "200":
          description: Current authenticated account wallet only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceWallet" }
        "401": { description: Authenticated account required }
  /meduha/admin/login:
    get:
      operationId: getMeduhaAdminStatus
      responses:
        "200":
          description: Admin session status, no account data for unauthorized users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
    post:
      operationId: loginMeduhaAdminPairing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPairingLoginInput" }
      responses:
        "200":
          description: Admin session established using a one-time pairing code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: "Invalid, expired, or consumed pairing code" }
  /meduha/admin/login/password:
    post:
      operationId: loginMeduhaAdminPassword
      description: Temporary admin only when explicit server login and password secret are configured. Requires X-Meduha-Request header; never grants a Telegram identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPasswordCredentials" }
      responses:
        "200":
          description: Eight-hour server session; revoked when server credentials change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "401": { description: Invalid credentials or password login disabled }
        "403": { description: CSRF protection rejected request }
        "429": { description: Attempt limit exceeded; Retry-After specifies seconds }
  /meduha/admin/logout:
    post:
      operationId: logoutMeduhaAdmin
      responses:
        "204": { description: Admin session revoked }
  /meduha/admin/sessions:
    get:
      operationId: listAdminSessions
      responses:
        "200":
          description: Active administrator sessions without credentials or configuration fingerprints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSessionInfo" }
        "403": { description: An active administrator session is required }
    delete:
      operationId: revokeOtherAdminSessions
      description: Revoke all active administrator sessions except the session making this request. Requires X-Meduha-Request.
      responses:
        "200":
          description: Other active administrator sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSessionsRevoked" }
        "403": { description: An active administrator session and CSRF header are required }
  /meduha/admin/sessions/{sessionId}:
    delete:
      operationId: revokeAdminSession
      description: Revoke one active administrator session other than the current session. Requires X-Meduha-Request.
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Administrator session revoked }
        "403": { description: An active administrator session and CSRF header are required }
        "404": { description: "Session is inactive, missing, or is the current session" }
  /meduha/admin/pairing:
    post:
      operationId: issueMeduhaAdminPairing
      responses:
        "201":
          description: Short-lived pairing code for authenticated designated admin in Telegram Mini App
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPairingCode" }
        "401": { description: Authenticated Telegram account required }
        "403": { description: Designated administrator required }
  /meduha/admin/channels:
    get:
      operationId: listAdminChannels
      responses:
        "200":
          description: Configured channels; credentials are never returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminChannel" }
    post:
      operationId: createAdminChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminChannelInput" }
      responses:
        "201":
          description: Disabled channel created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChannel" }
  /meduha/admin/channels/{channelId}:
    parameters:
      - { in: path, name: channelId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminChannel
      responses:
        "200":
          description: "Channel configuration, no credentials"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChannel" }
    patch:
      operationId: updateAdminChannel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminChannelUpdate" }
      responses:
        "200":
          description: Updated channel configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChannel" }
    delete:
      operationId: deleteAdminChannel
      responses:
        "204": { description: Channel deleted }
  /meduha/admin/models:
    get:
      operationId: listAdminModels
      responses:
        "200":
          description: Configured models; no connectivity is implied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminModel" }
    post:
      operationId: createAdminModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModelInput" }
      responses:
        "201":
          description: Disabled model created; generation is not enabled or verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModel" }
  /meduha/admin/models/{modelId}:
    parameters:
      - { in: path, name: modelId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminModel
      responses:
        "200":
          description: Configured model; no connectivity is implied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModel" }
    patch:
      operationId: updateAdminModel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminModelUpdate" }
      responses:
        "200":
          description: Updated model configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModel" }
    delete:
      operationId: deleteAdminModel
      responses:
        "204": { description: Model deleted }
  /meduha/admin/higgsfield/catalog:
    get:
      operationId: getHiggsfieldCatalog
      responses:
        "200":
          description: Officially documented model workflows and input parameters; no generation is submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HiggsfieldCatalog" }
        "403": { description: Designated administrator required }
        "503": { description: Official documentation is unavailable and no cached catalog is available }
  /meduha/admin/higgsfield/import:
    post:
      operationId: importHiggsfieldCatalogModels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HiggsfieldCatalogImportInput" }
      responses:
        "200":
          description: Newly imported models are disabled; existing model settings are left unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HiggsfieldCatalogImportResult" }
        "400": { description: Invalid request or non-Higgsfield channel }
        "403": { description: Designated administrator required }
        "404": { description: Channel not found }
        "503": { description: A fresh official catalog is unavailable }
  /meduha/admin/finance:
