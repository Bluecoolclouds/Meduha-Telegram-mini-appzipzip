  /meduha/admin/jobs:
    get:
      operationId: listAdminJobs
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 } }
      responses:
        "200":
          description: Real meduha works page only; response remains an array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeduhaWork" }
  /meduha/admin/audit:
    get:
      operationId: listAdminAudit
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Persistent audit event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
  /meduha/admin/ledger:
    get:
      operationId: listAdminLedger
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Paginated finance ledger from finance service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLedgerPage" }
  /meduha/admin/credits/adjust:
    post:
      operationId: adjustAdminCredits
      requestBody:
        required: true
